# Development services only: `docker compose up -d` in cmp/. Credentials here are local-only.
# Postgres starts with only its superuser (postgres/postgres, the DATABASE_URL_ADMIN of .env.db.example);
# `npm run db:init` then creates the cmp_owner, cmp_app and cmp_system roles and the cmp database.
# The owner and admin URLs belong in .env.db only (copy .env.db.example); a service running the app or
# worker gets .env, never .env.db.
name: cloveconsent-cmp

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.33
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # web UI and API
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

volumes:
  postgres-data:
