name: release
# Versions come from pull-request labels (scripts/version.mjs): a merged pull request with release:patch,
# release:minor or release:major publishes that version as a tag that carries dist/ (the first is 0.1.0);
# release:none publishes nothing. A direct push to main publishes nothing (a notice says so); to release
# one, run this workflow by hand on main and pick the kind. Pushes that change only docs or the hosted app
# in cmp/ are skipped (scripts/version.mjs skipRelease). main itself never contains dist/.
on:
  push: { branches: [main] }
  workflow_dispatch:
    inputs:
      label:
        description: Kind of version to release
        type: choice
        options: [release:patch, release:minor, release:major]
        required: true
permissions: { contents: read }
concurrency: { group: release, cancel-in-progress: false }
jobs:
  release:
    if: github.repository == 'KaktusBR/CloveConsent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - name: Decide whether and what to release
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          LABEL: ${{ inputs.label }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            PRS=$(node -p 'JSON.stringify([[process.argv[1]]])' "$LABEL")
          else
            if [ "$(node scripts/version.mjs skip "$BEFORE" "$AFTER")" = "true" ]; then
              echo "::notice::Only docs or the hosted app (cmp/) changed: nothing to release."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            PRS=$(gh api "repos/$REPO/commits/$AFTER/pulls" --jq "[.[] | select(.merged_at != null and .merge_commit_sha == \"$AFTER\") | [.labels[].name]]")
          fi
          DECISION=$(node scripts/version.mjs decide "$PRS")
          VERSION=$(node -p 'JSON.parse(process.argv[1]).release ?? ""' "$DECISION")
          if [ -z "$VERSION" ]; then
            echo "::notice::$(node -p 'JSON.parse(process.argv[1]).skip' "$DECISION")"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and tag
        if: steps.decide.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main "$GITHUB_SHA"
          node scripts/release.mjs "$VERSION"
      - name: Verify the tag in a fresh clone
        if: steps.decide.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          git clone --quiet --branch "v$VERSION" --depth 1 "file://$PWD" /tmp/verify
          cd /tmp/verify
          cp -r dist /tmp/committed-dist
          npm ci --ignore-scripts
          npm run build
          diff -r /tmp/committed-dist dist
      - name: Push the tag
        if: steps.decide.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: git push origin "refs/tags/v$VERSION"
