name: cmp
# The hosted app in cmp/. Runs for changes to the app and to the library files it builds from.
on:
  push:
    branches: [main]
    paths: ['cmp/**', '.github/workflows/cmp.yml', 'src/**', 'package.json', 'package-lock.json', 'tsup.config.ts', 'tsconfig.json']
  pull_request:
    paths: ['cmp/**', '.github/workflows/cmp.yml', 'src/**', 'package.json', 'package-lock.json', 'tsup.config.ts', 'tsconfig.json']
permissions: { contents: read }
concurrency: { group: 'cmp-${{ github.ref }}', cancel-in-progress: true }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.33
        env: { MP_SMTP_AUTH_ACCEPT_ANY: 'true', MP_SMTP_AUTH_ALLOW_INSECURE: 'true' }
        ports: ['1025:1025', '8025:8025']
    env:
      # the app's roles only; the owner and admin URLs are given to the database steps alone (below)
      DATABASE_URL: postgres://cmp_app:cmp_app@localhost:5432/cmp
      DATABASE_URL_SYSTEM: postgres://cmp_system:cmp_system@localhost:5432/cmp
      SMTP_URL: smtp://localhost:1025
      MAIL_FROM: noreply@localhost.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cmp/package-lock.json
      - name: Build the library (cmp uses it as file:..)
        run: npm ci --ignore-scripts && npm run build
      - run: npm ci
        working-directory: cmp
      - run: npm run typecheck
        working-directory: cmp
      - run: npm run lint
        working-directory: cmp
      - run: npm run check:words
        working-directory: cmp
      - run: npm test
        working-directory: cmp
      - run: npm run test:db
        working-directory: cmp
        env:
          DATABASE_URL_ADMIN: postgres://postgres:postgres@localhost:5432/postgres
          DATABASE_URL_MIGRATE: postgres://cmp_owner:cmp_owner@localhost:5432/cmp
      - name: Create the roles and database, apply the migrations (for the e2e server)
        run: npm run db:init && npm run db:migrate
        working-directory: cmp
        env:
          DATABASE_URL_ADMIN: postgres://postgres:postgres@localhost:5432/postgres
          DATABASE_URL_MIGRATE: postgres://cmp_owner:cmp_owner@localhost:5432/cmp
      - run: npx playwright install --with-deps chromium
        working-directory: cmp
      - run: npm run test:e2e
        working-directory: cmp
      - run: npm audit --omit=dev --audit-level=high
        working-directory: cmp

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the container image (context is the repository root)
        run: docker build -f cmp/Dockerfile --build-arg PUBLIC_ORIGIN=https://cmp.invalid -t cloveconsent-cmp:ci .
      - name: Build the backup image (compose.prod.yaml, service backup; context is cmp/backup)
        run: docker build -t cloveconsent-cmp-backup:ci cmp/backup
