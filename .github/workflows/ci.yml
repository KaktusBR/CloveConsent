name: ci
# The hosted app in cmp/ has its own workflow (cmp.yml); changes only there do not run the library's CI.
on:
  push: { branches: [main], paths-ignore: ['cmp/**', '.github/workflows/cmp.yml'] }
  pull_request: { paths-ignore: ['cmp/**', '.github/workflows/cmp.yml'] }
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:astro
      - run: npm run test:admin
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - run: npm audit --omit=dev --audit-level=high
