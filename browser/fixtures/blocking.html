<!DOCTYPE html>
<html lang="en">
<head>
<script src="/blocking.js"></script>
<meta charset="utf-8">
<title>A site with video, a map, analytics, a pixel and a widget</title>
<script type="text/plain" data-consent="google-analytics" async src="https://www.googletagmanager.com/gtag/js?id=G-TEST1234&amp;case=marked"></script>
<script type="text/plain" data-consent="meta-pixel" src="https://connect.facebook.net/en_US/fbevents.js?case=marked"></script>
<!-- forgotten: a tracker tag copied in unmarked, below the snippet; auto-blocking holds it -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-TEST1234&amp;case=unmarked"></script>
</head>
<body>
<p>A page whose only consent code is the site script, first in head.</p>
<iframe data-consent="youtube" data-consent-src="https://www.youtube-nocookie.com/embed/abc" title="Video" width="320" height="180" frameborder="0"></iframe>
<iframe data-consent="openstreetmap" data-consent-src="https://tile.openstreetmap.org/embed.html?case=map" title="Map" width="425" height="350" style="border: 1px solid black"></iframe>
<div data-consent-placeholder="widget"></div>
<script type="text/plain" data-consent="widget" src="https://widget.cloveconsent.test/widget.js"></script>
<div data-cloveconsent-settings></div>
<footer style="height: 60vh"></footer>
<script src="/blocking-inserted.js"></script>
</body>
</html>
